<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in | BU Task Planner</title>
    <link rel="icon" href="img/bu-seal.png">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/bootstrap.bundle.min.js" defer></script>
    <script src="js/motion.js" defer></script>
    <script src="js/api.js" defer></script>
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>
    <header><nav class="navbar navbar-expand-md" aria-label="Main navigation"><div class="container">
        <a class="navbar-brand" href="index.html"><img src="img/bu-seal.png" width="44" height="44" alt=""> BU Task Planner</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="main-nav"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link active" aria-current=page href="login.html">Log in</a></li><li class="nav-item"><a class="nav-link"  href="register.html">Register</a></li></ul></div>
    </div></nav></header>
    <main id="main" class="container page auth-page" tabindex="-1">

        <div class="auth-layout"><section class="card auth-card">
                    <h1>Welcome back.</h1><p class="text-secondary">Log in to your academic planner.</p>
                    <div id="registration-notice" role="status" class="alert alert-success" hidden></div>
                    <form id="login" action="#" method="POST" data-api class="form-stack">
                        
                        <div><label class="form-label" for="login-email">Email address</label>
        <input class="form-control" placeholder="you@example.com" type="email" id="login-email" name="email" required autocomplete="username"></div>
                        <div><label class="form-label" for="login-password">Password</label>
        <input class="form-control" type="password" id="login-password" name="password" required minlength="8" maxlength="72" autocomplete="current-password"></div>
                        <button class="btn btn-primary" type="submit">Log in</button><div class="form-feedback alert alert-info d-none" role="status"></div>
                    </form>
                    <p class="auth-switch">New to BU Task Planner? <a href="register.html">Create an account</a></p>
                </section><aside class="auth-art" aria-label="Sample academic planner"><img src="img/bu-entrance.webp" alt="Bicol University entrance" width="941" height="326"><figure class="agenda" aria-label="Sample weekly planner">
                <div class="agenda-page">
                    <div class="agenda-heading"><span>Weekly planner</span><span class="bookmark" aria-hidden="true"></span></div>
                    <h2>Coursework</h2>
                    <p class="agenda-caption">Sample week</p>
                    <div class="agenda-row"><span class="agenda-day">Mon</span><span>Dashboard wireframes<small>Web Systems</small></span><span class="task-check" aria-hidden="true"></span></div>
                    <div class="agenda-row"><span class="agenda-day">Wed</span><span>Review SQL joins<small>Database Management</small></span><span class="task-check" aria-hidden="true"></span></div>
                    <div class="agenda-row"><span class="agenda-day">Fri</span><span>Outline case study<small>Systems Analysis</small></span><span class="task-check checked" aria-hidden="true">✓</span></div>
                </div>
            </figure></aside></div>
    </main>
    <footer class="site-footer"><div class="container footer-inner">
        <span>Bicol University Polangui</span><span>IT 112 <span aria-hidden="true">·</span> Group 5 <span aria-hidden="true">·</span> BSIS-2B</span>
    </div></footer>

</body>
</html>
