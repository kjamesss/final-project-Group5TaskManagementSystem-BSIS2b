<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tasks | BU Task Planner</title>
    <link rel="icon" href="img/mark.png">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/bootstrap.bundle.min.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/mutations.js" defer></script>
    <script src="js/display.js" defer></script>
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>
    <header><nav class="navbar navbar-expand-md" aria-label="Main navigation"><div class="container">
        <a class="navbar-brand" href="index.html"><img src="img/mark.png" width="36" height="36" alt=""> BU Task Planner</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="main-nav"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link"  href="dashboard.html">Dashboard</a></li><li class="nav-item"><a class="nav-link active" aria-current=page href="tasks.html">Tasks</a></li><li class="nav-item"><a class="nav-link"  href="profile.html">Profile</a></li><li class="nav-item"><a class="nav-link" href="login.html">Log in</a></li><li class="nav-item"><button class="nav-link d-none" id="logout" type="button">Log out</button></li></ul></div>
    </div></nav></header>
    <main id="main" class="container page" tabindex="-1" data-view="tasks">
<div class="page-heading"><div><h1>Tasks</h1><p>Manage your coursework and find tasks by subject, status, or priority.</p></div><div class="action-row"><button class="btn btn-outline-primary" type="button" data-bs-toggle="modal" data-bs-target="#create-category-modal" >New subject</button><button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#create-task-modal" >New task</button></div></div>
        <div id="view-feedback" role="status"></div>
        <section class="card task-panel" data-results hidden aria-labelledby="all-tasks-heading">
            <h2 id="all-tasks-heading">Your tasks</h2>
            <form id="task-filters" action="#" method="GET" class="row g-3 filters">
                <div class="col-md-6 col-xl-4"><div><label class="form-label" for="task-filters-q">Search tasks</label>
        <input class="form-control" type="search" id="task-filters-q" name="q"></div></div>
                <div class="col-6 col-md-3 col-xl"><div><label class="form-label" for="task-filters-status">Filter by status</label><select class="form-select" id="task-filters-status" name="status"><option value="">Any status</option><option value="To Do">To Do</option><option value="In Progress">In Progress</option><option value="Completed">Completed</option></select></div></div>
                <div class="col-6 col-md-3 col-xl"><div><label class="form-label" for="task-filters-priority">Filter by priority</label><select class="form-select" id="task-filters-priority" name="priority"><option value="">Any priority</option><option value="Low">Low</option><option value="Medium">Medium</option><option value="High">High</option></select></div></div>
                <div class="col-md-8 col-xl-3"><div><label class="form-label" for="task-filters-category">Filter by subject</label><select class="form-select" id="task-filters-category" name="category"><option value="">Any subject</option><option value="uncategorized">Uncategorized</option></select></div></div>
            </form>
            <div class="results-bar"><span id="task-count" role="status"></span><button class="btn btn-link" type="reset" form="task-filters">Clear filters</button></div>
            <div id="task-list"></div><nav id="task-pages" aria-label="Task pagination"></nav>
        </section>
        <section class="card form-panel mt-4" data-results hidden aria-labelledby="subjects-heading">
            <h2 id="subjects-heading">Your subjects</h2>
            <div id="subject-list"></div>
        </section>
    </main>
    <footer class="site-footer"><div class="container footer-inner">
        <span>Bicol University Polangui</span><span>IT 112 <span aria-hidden="true">·</span> Group 5 <span aria-hidden="true">·</span> Phase 6</span>
    </div></footer>

    <div class="modal fade" id="create-task-modal" tabindex="-1" aria-labelledby="create-task-heading" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><div class="modal-content">
            <div class="modal-header"><h2 class="modal-title fs-5" id="create-task-heading">New task</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
            <div class="modal-body"><form id="create-task" action="#" method="POST" data-api class="form-stack">
        <div><label class="form-label" for="create-task-title">Task title</label>
        <input class="form-control" type="text" id="create-task-title" name="title" required></div>
        <div><label class="form-label" for="create-task-description">Description <small>(optional)</small></label>
            <textarea class="form-control" id="create-task-description" name="description" rows="3"></textarea></div>
        <div class="row g-3"><div class="col-sm-6"><div><label class="form-label" for="create-task-dueDate">Due date</label>
        <input class="form-control" type="date" id="create-task-dueDate" name="dueDate" required></div></div>
            <div class="col-sm-6"><div><label class="form-label" for="create-task-priority">Priority</label><select class="form-select" id="create-task-priority" name="priority"><option value="Medium">Medium</option><option value="Low">Low</option><option value="High">High</option></select></div></div></div>
        <div><label class="form-label" for="create-task-status">Status</label><select class="form-select" id="create-task-status" name="status"><option value="To Do">To Do</option><option value="In Progress">In Progress</option><option value="Completed">Completed</option></select></div>
        <div><label class="form-label" for="create-task-category">Subject or course (optional)</label><select class="form-select" id="create-task-category" name="category"><option value="">Uncategorized</option></select></div>
        <div class="form-feedback alert alert-info d-none" role="status"></div><div class="action-row justify-content-end"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Create task</button></div></form></div>
        </div></div>
    </div>
    <div class="modal fade" id="create-category-modal" tabindex="-1" aria-labelledby="create-category-heading" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><div class="modal-content">
            <div class="modal-header"><h2 class="modal-title fs-5" id="create-category-heading">New subject or course</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
            <div class="modal-body"><form id="create-category" action="#" method="POST" data-api class="form-stack"><div><label class="form-label" for="create-category-name">Subject or course name</label>
        <input class="form-control" type="text" id="create-category-name" name="name" required></div>
        <div><label class="form-label" for="create-category-color">Display color (optional)</label>
        <select class="form-select" id="create-category-color" name="color">
            <option value="">Default</option><option value="#2563eb">Blue</option><option value="#0f766e">Teal</option>
            <option value="#7c3aed">Purple</option><option value="#b45309">Amber</option>
        </select></div><div class="form-feedback alert alert-info d-none" role="status"></div><div class="action-row justify-content-end"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Add subject</button></div></form></div>
        </div></div>
    </div>
    <div class="modal fade" id="mutation-modal" tabindex="-1" aria-labelledby="mutation-title" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header"><h2 class="modal-title fs-5" id="mutation-title"></h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
                <div class="modal-body">
                    <form class="form-stack">
                        <div id="mutation-fields" class="form-stack"></div>
                        <div role="status" class="d-none"></div>
                        <div class="d-flex gap-2 justify-content-end">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Save changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
